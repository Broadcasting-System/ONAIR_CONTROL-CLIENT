# 컨트롤 웹 테스트 — main 으로 가는 PR·푸시마다 단위 테스트·린트·타입 검사
# (서버 PC 업데이트가 pnpm install --frozen-lockfile 을 쓰므로 여기서도 같은 잠금 파일로 설치한다)
name: test

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: 단위 테스트 (Vitest)
        run: pnpm test

      - name: 린트
        run: pnpm lint

      - name: 타입 검사
        run: pnpm exec tsc --noEmit

      # 저장소를 합치지 않는 대신(docs/adr-monorepo.md) 송출 화면 저장소와 같은 코드로 둔 파일이 어긋나면 실패
      - name: 송출 화면 저장소 main 받기 (공유 파일 비교용)
        uses: actions/checkout@v4
        with:
          repository: Broadcasting-System/ONAIR_DISPLAY-CLIENT
          ref: main
          path: .shared-other

      - name: 공유 파일 복사본 검사
        run: node scripts/check-shared-copies.mjs --self control --other .shared-other
